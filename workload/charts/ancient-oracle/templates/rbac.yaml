# The Oracle only reads. It never sees Secrets and never writes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ancient-oracle
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ao.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ancient-oracle-reader
  labels:
    {{- include "ao.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes, pods, services, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ancient-oracle-reader
  labels:
    {{- include "ao.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ancient-oracle-reader
subjects:
  - kind: ServiceAccount
    name: ancient-oracle
    namespace: {{ .Release.Namespace }}

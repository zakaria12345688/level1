{{- if .Values.ingress.enabled }}
# http://<gate>/mcp, with the basic auth from `terraform output` (ingress.tf).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ancient-oracle
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ao.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.ingress.middlewareNamespace }}-guild-auth@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: ancient-oracle
                port:
                  name: http
{{- end }}

# Access of the metrics-collector account.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-collector-reader
  labels:
    app.kubernetes.io/part-of: monitoring
    {{- include "km.labels" . | nindent 4 }}
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.achrona.io/aggregate-to-collector: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-collector-core
  labels:
    rbac.achrona.io/aggregate-to-collector: "true"
    app.kubernetes.io/part-of: monitoring
    {{- include "km.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, namespaces, nodes, nodes/metrics]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-collector-metrics
  labels:
    rbac.achrona.io/aggregate-to-collector: "true"
    app.kubernetes.io/part-of: monitoring
    {{- include "km.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-collector-scrape-config
  labels:
    rbac.achrona.io/aggregate-to-collector: "true"
    app.kubernetes.io/part-of: monitoring
    {{- include "km.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-collector-reader
  labels:
    app.kubernetes.io/part-of: monitoring
    {{- include "km.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: metrics-collector
    namespace: {{ .Release.Namespace }}

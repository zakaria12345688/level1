# A small web page with a magician who shouts one of the spells in the
# `spells` ConfigMap. Reach it with:
#   kubectl port-forward -n {{ .Values.scrolls.namespace }} svc/magician 8080:80
apiVersion: v1
kind: ConfigMap
metadata:
  name: spells
  namespace: {{ .Values.scrolls.namespace }}
  labels:
    app.kubernetes.io/part-of: scrolls
    {{- include "km.labels" . | nindent 4 }}
data:
  spells.txt: |
    {{- range .Values.magician.spells }}
    {{ . }}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: magician-page
  namespace: {{ .Values.scrolls.namespace }}
  labels:
    app.kubernetes.io/part-of: scrolls
    {{- include "km.labels" . | nindent 4 }}
data:
  index.html: |
    {{- .Files.Get "files/magician.html" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magician
  namespace: {{ .Values.scrolls.namespace }}
  labels:
    app.kubernetes.io/name: magician
    app.kubernetes.io/part-of: scrolls
    {{- include "km.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: magician
  template:
    metadata:
      labels:
        app.kubernetes.io/name: magician
        app.kubernetes.io/part-of: scrolls
    spec:
      serviceAccountName: scrolls-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: magician
          image: {{ .Values.scrolls.image.repository }}:{{ .Values.scrolls.image.tag }}
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: site
              mountPath: /www
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: site
          projected:
            sources:
              - configMap:
                  name: magician-page
              - configMap:
                  name: spells
---
apiVersion: v1
kind: Service
metadata:
  name: magician
  namespace: {{ .Values.scrolls.namespace }}
  labels:
    app.kubernetes.io/part-of: scrolls
    {{- include "km.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: magician
  ports:
    - name: http
      port: 80
      targetPort: http
